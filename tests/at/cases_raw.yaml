- id: case_1652877
  name: 鼠标放置超链接处显示以及跳转
  module: /V25_2500（测试部专用）/B类解耦商店应用/终端/104X/超链接(#116163)
  description: 鼠标放置超链接处显示以及跳转
  status: active
  reason: ''
  steps:
  - step_type: action
    description: 1. 打开终端，输入一个带有网址的命令，比如：ping www.baidu.com，鼠标放置超链接处
    needs_accessible_name: false
  - step_type: action
    description: 2. 键盘按下ctrl键
    needs_accessible_name: false
  - step_type: action
    description: 3. 终端中直接输入一个网址，如：www.baidu.com按回车键
    needs_accessible_name: false
  - step_type: action
    description: 4. 鼠标放置未找到命令前方的超链接处
    needs_accessible_name: false
  - step_type: action
    description: 5. 键盘按下ctrl键
    needs_accessible_name: false
  - step_type: action
    description: 注意点：鼠标移至超链接文本上时，用户按下ctrl键时可能在进行其他操作（比如快捷键操作），此处保持了与konsole一致属于正常现象，即只要ctrl键被按下光标就变成手指形状。
    needs_accessible_name: false
  - step_type: assert
    description: 1. 鼠标形状变成I形状
    needs_accessible_name: false
  - step_type: assert
    description: 2. 鼠标光标变为手指形状，同时点击鼠标左键可直接打开超链接网址
    needs_accessible_name: false
  - step_type: assert
    description: '3. 提示bash: www.baidu.com: 未找到命令'
    needs_accessible_name: false
  - step_type: assert
    description: 4. 鼠标形状变成I形状
    needs_accessible_name: false
  - step_type: assert
    description: 5. 鼠标光标变为手指形状，同时点击鼠标左键可直接打开超链接网址
    needs_accessible_name: false
