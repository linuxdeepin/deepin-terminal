name: 自定义命令_suite
app: deepin-terminal
description: ''
module: 自定义命令
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-terminal
  wait: 5.0
suites:
- id: suite_自定义命令_输入名称_1_s1
  name: 自定义命令-输入名称
  description: ''
  tags: []
  steps:
  - action: element_action
    description: "打开菜单 → 自定义命令"
    selector:
      name: 自定义命令
    do: click
  - action: element_action
    selector:
      name: IconButton
      role: panel
    do: click
  - action: keyboard_press
    key: escape
  - action: element_action
    selector:
      name: IconButton
      role: panel
    do: click
  - action: keyboard_type
    text: test_cmd_1
  - action: keyboard_press
    key: escape
  - action: element_action
    selector:
      name: IconButton
      role: panel
    do: click
  - action: keyboard_type
    text: '*&！@#￥'
  - action: keyboard_press
    key: escape
  - action: element_action
    selector:
      name: IconButton
      role: panel
    do: click
  - action: keyboard_type
    text: test命令_123@#
  - action: keyboard_press
    key: escape
  assert_steps:
  - action: assert_element
    selector:
      name: RightPanel
