name: 设置界面基础设置_suite
app: deepin-terminal
description: ''
module: 设置界面基础设置
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-terminal
  wait: 5.0
suites:
- id: suite_设置界面基础设置_1_s1
  name: 设置-基础设置模块测试
  description: ''
