      name: 设置
    do: click
  - action: wait
    wait: 1.0
  - action: keyboard_press
    key: escape
  assert_steps:
  - action: assert_element
    selector:
      name: NormalWindow
  - action: assert_element
    selector:
      name: SettingsFontFamilyComboBox
  - action: assert_element
