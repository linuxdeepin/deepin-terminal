    selector:
      name: NormalWindow
  - action: assert_element
    selector:
      name: NormalWindow
  - action: assert_element
    selector:
      name: NormalWindow
- id: suite_重命名标题_1_s1
  name: 重命名标题
  description: ''
  tags: []
  steps:
  - action: dtk_context_menu
    selector:
      name: TabBar
    items:
    - 重命名标题
  - action: keyboard_press
    key: escape
  - action: dtk_context_menu
    selector:
      name: TabBar
    items:
    - 重命名标题
  - action: keyboard_type
    text: 新标签标题
  - action: keyboard_press
    key: enter
  assert_steps:
